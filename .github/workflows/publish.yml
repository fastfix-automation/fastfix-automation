name: Publish queued posts

on:
  push:
    branches: [main]
    paths:
      - "queue/**.json"
  workflow_dispatch: {}
  schedule:
    # Runs hourly so scheduled posts (queue files with a future "publish_at") go out
    # automatically at the right time, even if nothing was just pushed.
    - cron: "5 * * * *"

permissions:
  contents: write

# Only one publish run at a time, and never skip/cancel a queued one — if two
# runs overlapped, both could call the Meta API for the same post before
# either commits the "already posted" result, causing a double-post.
concurrency:
  group: publish-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Publish to Meta
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/publish.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "fastfix-automation-bot"
          git config user.email "actions@github.com"
          git add queue published failed
          git diff --staged --quiet && exit 0

          git commit -m "Post result $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # The queue/published/failed move already happened locally (and the
          # Meta API calls already fired) — losing this push would mean the
          # next run re-publishes the same post. So on a non-fast-forward
          # rejection (e.g. another push landed on main meanwhile), rebase
          # onto the new remote tip and retry instead of giving up.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto latest main and retrying."
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          echo "::error::Could not push publish results after 5 attempts — check for a stuck/conflicting commit on main."
          exit 1
