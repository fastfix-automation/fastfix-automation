name: Publish queued posts

on:
  push:
    branches: [main]
    paths:
      - "queue/**.json"
  workflow_dispatch: {}
  schedule:
    # Runs hourly so scheduled posts (queue files with a future "publish_at") go out
    # automatically at the right time, even if nothing was just pushed.
    - cron: "5 * * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Publish to Meta
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/publish.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "fastfix-automation-bot"
          git config user.email "actions@github.com"
          git add queue published failed
          git diff --staged --quiet || git commit -m "Post result $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
