name: GBP reviews — fetch + reply

on:
  push:
    branches: [main]
    paths:
      - "reviews/reply-queue/**.json"
  workflow_dispatch: {}
  schedule:
    # Fetch new reviews a few times a day; Claude's own daily check-in then
    # drafts replies from whatever lands in reviews/pending/.
    - cron: "20 */6 * * *"

permissions:
  contents: write

concurrency:
  group: gbp-reviews
  cancel-in-progress: false

jobs:
  reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch new reviews
        working-directory: scripts
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
        run: python gbp_fetch_reviews.py

      - name: Post approved replies
        working-directory: scripts
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
        run: python gbp_reply.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "fastfix-automation-bot"
          git config user.email "actions@github.com"
          git add reviews
          git diff --staged --quiet && exit 0

          git commit -m "GBP reviews update $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto latest main and retrying."
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          echo "::error::Could not push review results after 5 attempts."
          exit 1
